<svg width="1280" height="260" viewBox="0 0 1280 260" fill="none"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"
  shape-rendering="crispEdges">
  <title id="title">Motif Balance — balanced motif design</title>
  <desc id="desc">Motif Balance beside four stages: model, scan, balance motif scores at the limiting threshold, and select.</desc>
  <rect width="1280" height="260" fill="#1E1D1A"/>

  <g font-family="Menlo, Monaco, Consolas, monospace">
    <text x="48" y="125" fill="#F3EFE7" font-size="50" font-weight="700" letter-spacing="-2">motif balance</text>
    <text x="52" y="158" fill="#969087" font-size="12" letter-spacing="1.4">BALANCED MOTIF DESIGN</text>
    <rect x="52" y="177" width="40" height="6" fill="#D97757"/>
  </g>

  <path d="M432 46V214" stroke="#3F3C37" stroke-width="2"/>
  <path d="M520 132H1192" stroke="#5A5650" stroke-width="2"/>

  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="12"
    font-weight="700" letter-spacing="0.6">
    <g transform="translate(520 0)">
      <rect x="0" y="98" width="10" height="18" fill="#969087"/>
      <rect x="16" y="82" width="10" height="34" fill="#F3EFE7"/>
      <rect x="32" y="92" width="10" height="24" fill="#D97757"/>
      <rect x="48" y="72" width="10" height="44" fill="#F3EFE7"/>
      <text x="0" y="174" fill="#F3EFE7">MODEL</text>
    </g>

    <g transform="translate(690 0)">
      <path d="M0 88H92M0 108H92" stroke="#969087" stroke-width="2"/>
      <rect x="24" y="84" width="42" height="8" fill="#F3EFE7"/>
      <rect x="50" y="104" width="30" height="8" fill="#D97757"/>
      <text x="0" y="174" fill="#F3EFE7">SCAN</text>
    </g>

    <g transform="translate(876 0)">
      <path d="M0 76H72M0 96H72M0 116H72" stroke="#F3EFE7" stroke-width="6"/>
      <rect x="18" y="73" width="24" height="6" fill="#D97757"/>
      <rect x="34" y="93" width="22" height="6" fill="#D97757"/>
      <rect x="8" y="113" width="30" height="6" fill="#D97757"/>
      <path d="M78 70V122" stroke="#D97757" stroke-width="4"/>
      <rect x="74" y="112" width="8" height="8" fill="#D97757"/>
      <text x="0" y="174" fill="#F3EFE7">BALANCE</text>
    </g>

    <g transform="translate(1062 0)">
      <rect x="0" y="76" width="88" height="6" fill="#F3EFE7"/>
      <rect x="0" y="94" width="72" height="6" fill="#F3EFE7"/>
      <rect x="0" y="112" width="56" height="6" fill="#969087"/>
      <rect x="96" y="74" width="8" height="8" fill="#D97757"/>
      <rect x="80" y="92" width="8" height="8" fill="#D97757"/>
      <rect x="64" y="110" width="8" height="8" fill="#D97757"/>
      <text x="0" y="174" fill="#F3EFE7">SELECT</text>
    </g>
  </g>
</svg>
