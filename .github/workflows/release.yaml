name: Private prerelease artifacts

on:
  push:
    tags: ["v*a*", "v*b*", "v*rc*"]

permissions:
  contents: read

jobs:
  build:
    name: Build verified prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Verify prerelease tag and project version
        run: |
          test "${{ github.event.repository.visibility }}" = "private"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${project_version}"
          python -c 'import re, sys; version = sys.argv[1]; sys.exit(0 if re.fullmatch(r"[0-9]+(?:\.[0-9]+){2}(?:a|b|rc)[0-9]+", version) else 1)' "$project_version"
      - name: Verify release commit is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Prepare attested private prerelease
        run: >-
          bash ./scripts/prepare-private-prerelease
          --out "${RUNNER_TEMP}/motif-balance-dist"
          --builder-kind github_actions
          --limitation independent_rebuild_not_performed
      - name: Stage verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motif-balance-prerelease-distributions
          path: ${{ runner.temp }}/motif-balance-dist/
          if-no-files-found: error
          retention-days: 1
