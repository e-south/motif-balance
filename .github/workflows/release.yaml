name: Release artifacts

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    name: Build verified release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Verify release tag and project version
        run: |
          test "${{ github.event.repository.visibility }}" = "public"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${project_version}"
          python -c 'import re, sys; version = sys.argv[1]; sys.exit(0 if re.fullmatch(r"[0-9]+(?:\.[0-9]+){2}(?:(?:a|b|rc)[0-9]+)?", version) else 1)' "$project_version"
      - name: Verify release commit is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Prepare attested prerelease
        run: >-
          bash ./scripts/prepare-prerelease
          --out "${RUNNER_TEMP}/motif-balance-dist"
          --builder-kind github_actions
          --limitation independent_rebuild_not_performed
      - name: Stage verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motif-balance-prerelease-distributions
          path: ${{ runner.temp }}/motif-balance-dist/
          if-no-files-found: error
          retention-days: 1
