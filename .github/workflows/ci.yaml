name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Diagnose publisher response metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          source = json.loads(Path("src/motif_balance/examples/data/argr-cra/SOURCE.json").read_text())
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          requests = (
              ("default urllib", source["url"]),
              ("package User-Agent", Request(source["url"], headers={
                  "User-Agent": f"motif-balance/{version} (+https://github.com/e-south/motif-balance)",
              })),
          )
          for label, request in requests:
              metadata = {"request": label}
              try:
                  with urlopen(request, timeout=20) as response:
                      data = response.read(32 * 1024 * 1024 + 1)
                      digest = hashlib.sha256(data).hexdigest()
                      metadata.update(
                          status=response.status,
                          content_type=response.headers.get("Content-Type"),
                          bytes=len(data),
                          sha256=digest,
                          expected_archive=digest == source["archive_sha256"],
                          final_host=urlsplit(response.url).hostname,
                          zip_signature=data.startswith(b"PK"),
                      )
              except Exception as error:
                  metadata.update(error=type(error).__name__, status=getattr(error, "code", None))
              notice = json.dumps(metadata, sort_keys=True).replace("%", "%25")
              print(f"::notice title=Publisher response metadata::{notice}", flush=True)
          PY
      - name: Verify repository
        run: bash ./scripts/verify

  python-compatibility:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Test package
        run: uv run --locked --extra visualization --python ${{ matrix.python-version }} pytest -q --no-cov

  checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, python-compatibility]
    if: always()
    steps:
      - name: Require successful jobs
        run: |
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.python-compatibility.result }}" = "success"
